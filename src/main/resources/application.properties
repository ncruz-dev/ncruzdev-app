quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:9090
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, origin, x-custom-header
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, PATCH
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=86400

# Configuración centralizada para CORS
cors.allowed.origins=http://localhost:4200
